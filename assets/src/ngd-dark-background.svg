<?xml version="1.0" encoding="UTF-8"?> <svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Next Gen Drywall — Dark background pattern</title><defs><pattern id="grid-sm" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.032)" stroke-width="0.5"></path></pattern><pattern id="grid-lg" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M 120 0 L 0 0 0 120" fill="none" stroke="rgba(255,255,255,0.055)" stroke-width="0.75"></path></pattern><pattern id="hatch" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="24" stroke="rgba(255,255,255,0.018)" stroke-width="0.5"></line></pattern><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="0.8" fill="rgba(255,255,255,0.07)"></circle></pattern></defs><!-- Base --><rect width="1600" height="900" fill="#181918"></rect><!-- Hatch --><rect width="1600" height="900" fill="url(#hatch)"></rect><!-- Fine grid --><rect width="1600" height="900" fill="url(#grid-sm)"></rect><!-- Large grid --><rect width="1600" height="900" fill="url(#grid-lg)"></rect><!-- Panel ghost shapes --><rect x="0" y="0" width="560" height="300" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"></rect><rect x="1040" y="150" width="560" height="600" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="0.75"></rect><rect x="0" y="520" width="480" height="380" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.75"></rect><rect x="280" y="300" width="1040" height="300" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="0.5"></rect><!-- Dot grid — right area --><rect x="800" y="0" width="800" height="450" fill="url(#dots)" opacity="0.6"></rect><!-- Vertical studs --><line x1="200" y1="0" x2="200" y2="900" stroke="rgba(255,255,255,0.028)" stroke-width="0.5"></line><line x1="280" y1="0" x2="280" y2="900" stro